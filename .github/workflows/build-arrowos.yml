name: Build Lunaris OS

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'ROM Manifest URL'
        required: true
        default: 'https://github.com/Lunaris-AOSP/android.git'
      MANIFEST_BRANCH:
        description: 'ROM Branch'
        required: true
        default: '16'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/malachite-project/android_device_xiaomi_malachite.git'
      VENDOR_TREE_URL:
        description: 'Vendor Tree URL'
        required: true
        default: 'https://github.com/malachite-project/android_vendor_xiaomi_malachite.git'
      KERNEL_TREE_URL:
        description: 'Kernel Tree URL'
        required: true
        default: 'https://github.com/malachite-project/android_kernel_xiaomi_malachite.git'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/xiaomi/malachite'
      VENDOR_PATH:
        description: 'Vendor Path'
        required: true
        default: 'vendor/xiaomi/malachite'
      KERNEL_PATH:
        description: 'Kernel Path'
        required: true
        default: 'kernel/xiaomi/malachite'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'malachite'
      LUNCH_TARGET:
        description: 'Lunch Target'
        required: true
        default: 'lunaris_malachite-userdebug'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Verify Repository Owner
        if: github.event.repository.owner.login != github.event.sender.login
        run: |
          echo "Unauthorized sender."
          exit 1

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get clean
          docker rmi $(docker images -q) -f || true
          df -h

      - name: Initialize Workspace
        run: |
          mkdir -p workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        id: pwd

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig libncurses5 openjdk-17-jdk python3 python3-pip rsync bc ccache aria2

          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          sudo ln -sf ~/.bin/repo /usr/local/bin/repo

          git config --global user.name "GitHub-Actions-Builder"
          git config --global user.email "actions@github.com"

          mkdir -p ${{ steps.pwd.outputs.workspace-folder }}/ccache
          export USE_CCACHE=1
          export CCACHE_DIR=${{ steps.pwd.outputs.workspace-folder }}/ccache
          ccache -M 30G

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Sync Lunaris ROM Sources
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          mkdir -p android && cd android
          repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --git-lfs --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Clone Device, Vendor, and Kernel Trees
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/android
          git clone --depth=1 ${{ github.event.inputs.DEVICE_TREE_URL }} ${{ github.event.inputs.DEVICE_PATH }}
          git clone --depth=1 ${{ github.event.inputs.VENDOR_TREE_URL }} ${{ github.event.inputs.VENDOR_PATH }}
          git clone --depth=1 ${{ github.event.inputs.KERNEL_TREE_URL }} ${{ github.event.inputs.KERNEL_PATH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Compile ROM
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/android
          export USE_CCACHE=1
          export CCACHE_DIR=${{ steps.pwd.outputs.workspace-folder }}/ccache
          source build/envsetup.sh
          lunch ${{ github.event.inputs.LUNCH_TARGET }}
          m bacon -j$(nproc --all)
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Inspect Output Directory
        run: |
          ls -la ${{ steps.pwd.outputs.workspace-folder }}/android/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/

      - name: Upload Output to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: |
            ${{ steps.pwd.outputs.workspace-folder }}/android/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/Lunaris*.zip
            ${{ steps.pwd.outputs.workspace-folder }}/android/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/boot.img
            ${{ steps.pwd.outputs.workspace-folder }}/android/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
          name: Lunaris-AOSP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: malachite-${{ github.run_id }}
          body: |
            ROM: Lunaris-AOSP (Android 16)
            Device: ${{ github.event.inputs.DEVICE_NAME }}
            Run ID: ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
